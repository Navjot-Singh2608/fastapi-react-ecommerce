[project]
name = "shopcart-backend"
version = "0.1.0"
description = "ShopCart FastAPI Backend"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
    "pyjwt",
    "pwdlib[argon2]",
    "python-multipart",
    "pydantic-settings",
    "email-validator",
    "psycopg2-binary>=2.9.12",
]
